packages:
  - '.'

allowBuilds:
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  sharp: false
  sqlite3: true
  unrs-resolver: false

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

onlyBuiltDependencies:
  - better-sqlite3
  - sqlite3
  - '@prisma/engines'
  - esbuild
  - prisma

# Keep the patched vite floor without a direct dependency on it.
overrides:
  vite: ^8.3.5
